name: Regenerate TDD registry

on:
  schedule:
    # 08:17 UTC daily. Deliberately off the hour to dodge GitHub's
    # top-of-hour congestion on scheduled workflows.
    - cron: '17 8 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'config/tdd-repos.yaml'
      - 'scripts/regenerate-tdd-registry.sh'
      - 'scripts/lib/render-registry.sh'
      - '.github/workflows/regenerate-tdd-registry.yml'

permissions:
  contents: read

concurrency:
  group: regenerate-tdd-registry
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ARGUS_REGISTRY_APP_ID }}
          private-key: ${{ secrets.ARGUS_REGISTRY_APP_KEY }}
          owner: Big-Health

      - uses: actions/checkout@v4
        with:
          # Use the App token so `git push` in the final step authenticates as the App.
          token: ${{ steps.app-token.outputs.token }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Regenerate registry
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ./scripts/regenerate-tdd-registry.sh

      - name: Open or update PR if registry changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet doc/tdd-registry.md doc/tdd-registry.json; then
            echo 'No registry changes; nothing to do.'
            exit 0
          fi

          BRANCH=auto/tdd-registry
          git config user.name  'argus-registry-sync[bot]'
          git config user.email 'argus-registry-sync[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add doc/tdd-registry.md doc/tdd-registry.json
          git commit -m 'chore: regenerate TDD registry'
          git push -f origin "$BRANCH"

          # Open a PR if one isn't already open against this branch.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title 'chore: regenerate TDD registry' \
              --body  'Automated update by the regenerate-tdd-registry workflow. See the latest workflow run for source.' \
              --base  main \
              --head  "$BRANCH"
          else
            echo "PR already open against $BRANCH; force-pushed update."
          fi
