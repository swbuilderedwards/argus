# Repositories enrolled in the TDD registry.
#
# Adding a repo here causes the next run of the regenerate-tdd-registry
# workflow to scan its doc/tdds/ directory, parse frontmatter from each
# TDD, and include it in doc/tdd-registry.md and doc/tdd-registry.json.
#
# Schema:
#   repos:
#     - name: <org>/<repo>     # required, e.g. Big-Health/vercel-billflow
#
# Prerequisites for a new enrollment:
#   1. The repo has a doc/tdds/ directory (workflow will skip silently if absent).
#   2. TDD files follow the frontmatter contract documented in
#      argus/process/engineering-handbook.md ("TDD registry").
#   3. The argus-registry-sync GitHub App is installed on the repo.
#
# See argus/phasing/phasing-tdd-registry.md for the rollout plan.

repos: []
